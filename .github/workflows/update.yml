name: daily-scraper
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run scraper
        run: python3 scraper/scraper.py
      - name: Commit updated data
        run: |
          git config user.name "scholarship-bot"
          git config user.email "bot@scholarships-moscow"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data update $(date -u +%F)"
          git push
